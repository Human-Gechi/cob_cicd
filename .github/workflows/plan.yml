name: Terraform PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Show context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "role=${{ vars[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: eu-north-1

      - name: Init
        run: terraform init -input=false -backend-config=backend/${{ matrix.environment }}.hcl

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var-file=envs/${{ matrix.environment }}.tfvars -no-color > plan.txt
          {
            echo "### Terraform plan: ${{ matrix.environment }}"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"